name: Build Limu Connect

on:
  push:
    paths:
      - "mod/**"
      - ".github/workflows/build.yml"
    branches: ["main", "mod-sync"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limu-connect-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Read mod version
        id: mod-version
        working-directory: mod
        run: echo "version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"

      - name: Compile and package
        working-directory: mod
        run: gradle --no-daemon clean build

      - name: Publish versioned GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.mod-version.outputs.version }}
          name: Limu Connect ${{ steps.mod-version.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{ github.ref_name == 'mod-sync' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: mod/build/libs/LimuConnect-NeoForge-1.21.1-${{ steps.mod-version.outputs.version }}.jar

      - name: Upload client mod
        uses: actions/upload-artifact@v4
        with:
          name: LimuConnect-NeoForge-1.21.1-${{ steps.mod-version.outputs.version }}
          path: mod/build/libs/*[!.sources].jar
          if-no-files-found: error
          retention-days: 30
